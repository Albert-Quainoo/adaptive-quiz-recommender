name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run PostgreSQL integration tests
        env:
          QUIZ_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          QUIZ_CONFIRM_DESTRUCTIVE_POSTGRES_TESTS: "1"
        run: |
          python -m pytest tests/test_postgres_adaptive_repository.py tests/test_postgres_replenishment_jobs.py tests/test_postgres_course_ownership_migration.py -q

      - name: Validate the committed 43-item approved bank
        run: |
          python scripts/validate_approved_bank.py \
            --bank outputs/approved_banks/pilot-approved-bank-43-v1.jsonl \
            --course ai \
            --expected-count 43 \
            --required-skill-id AI-FND-01 \
            --required-skill-id AI-AGT-01 \
            --required-skill-id AI-SRC-01 \
            --required-skill-id AI-SRC-02 \
            --required-skill-id AI-SRC-03 \
            --required-skill-id AI-SRC-08 \
            --output "${RUNNER_TEMP}/pilot-approved-bank-43-v1-validation.json"

      - name: Validate the committed 45-item Intro AI bank (active)
        run: |
          python scripts/validate_approved_bank.py \
            --bank outputs/approved_banks/pilot-approved-bank-45-v1-proposed.jsonl \
            --course ai \
            --expected-count 45 \
            --required-skill-id AI-FND-01 \
            --required-skill-id AI-AGT-01 \
            --required-skill-id AI-SRC-01 \
            --required-skill-id AI-SRC-02 \
            --required-skill-id AI-SRC-03 \
            --required-skill-id AI-SRC-08 \
            --required-skill-id AI-FND-03 \
            --required-skill-id AI-FND-04 \
            --output "${RUNNER_TEMP}/pilot-approved-bank-45-v1-validation.json"

      - name: Verify the active-bank pointer resolves to the 45-item bank
        run: |
          python -c "
          from authoring.replenishment.manifest import load_course_manifest, active_bank_path
          manifest = load_course_manifest('intro-ai')
          resolved = active_bank_path(manifest)
          print('resolved active bank path:', resolved)
          assert str(resolved) == 'outputs/approved_banks/pilot-approved-bank-45-v1-proposed.jsonl'
          "

      - name: Verify the committed BKT model checksum
        run: |
          cd outputs
          shasum -a 256 -c bkt_dev_model_v4.pkl.sha256
          shasum -a 256 -c bkt_dev_model_v6.pkl.sha256

      - name: Verify the committed BKT model loads
        run: |
          python -c "
          from app.bootstrap import load_fitted_bkt_model
          model = load_fitted_bkt_model('outputs/bkt_dev_model_v4.pkl', model_version='bkt-synthetic-v4', course_id='intro-ai')
          skills = sorted(set(model.get_parameters().index.get_level_values('skill')))
          print('BKT model loaded, skills:', skills)
          assert skills == ['AI-AGT-01', 'AI-FND-01', 'AI-SRC-01', 'AI-SRC-02', 'AI-SRC-03', 'AI-SRC-08']
          "

      - name: Verify the active Intro AI BKT model (v6) loads and covers the 45-item bank
        run: |
          python -c "
          from app.bootstrap import load_fitted_bkt_model
          model = load_fitted_bkt_model('outputs/bkt_dev_model_v6.pkl', model_version='bkt-synthetic-v6', course_id='intro-ai')
          skills = sorted(set(model.get_parameters().index.get_level_values('skill')))
          print('BKT model loaded, skills:', skills)
          assert skills == ['AI-AGT-01', 'AI-FND-01', 'AI-FND-03', 'AI-FND-04', 'AI-SRC-01', 'AI-SRC-02', 'AI-SRC-03', 'AI-SRC-08']
          "
