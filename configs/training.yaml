model:
  name: meta-llama/Llama-3.1-8B-Instruct
  max_sequence_length: 2048
  load_in_4bit: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 3
  learning_rate: 0.0002
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  seed: 42

output:
  directory: outputs/llama31-adaptive-quiz-lora
